name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} / jQuery ${{ matrix.jquery }}
    runs-on: ubuntu-latest

    strategy:
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        node: ['20', '22']
        # The versions the package claims to support in peerDependencies.
        jquery: ['1.12.4', '2.2.4', '3.7.1', '4.0.0']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the jQuery version under test
        run: npm install --no-save jquery@${{ matrix.jquery }}

      - name: Build, lint and test
        # The runner ships Chrome; the Gruntfile picks it up from CHROME_BIN
        # rather than hardcoding a path.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx grunt test

  package:
    name: package checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npx grunt build

      - name: Validate package exports
        run: npx publint

      - name: Validate TypeScript declarations
        run: npx --yes @arethetypeswrong/cli --pack --ignore-rules no-resolution
