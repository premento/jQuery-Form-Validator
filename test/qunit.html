<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QUnit Tests</title>
    <link rel="stylesheet" href="../node_modules/qunitjs/qunit/qunit.css">
</head>
<body>

<div id="qunit"></div>
<div id="qunit-fixture"></div>
<form id="dummy-form" style="visibility: hidden"></form>

<script src="../node_modules/jquery/dist/jquery.min.js"></script>
<script src="../node_modules/qunitjs/qunit/qunit.js"></script>
<script src="../form-validator/jquery.form-validator.js"></script>
<script src="../node_modules/numeral/numeral.js"></script>
<script>
(function($) {

    var $form = $('#dummy-form'), $in=null;
    window.$form = $form;
    window.$in = $in;

    function input(val, dataValidationAttr, elAttr, elemName) {
        if(!elAttr)
            elAttr = {};
        if( typeof dataValidationAttr === 'string') {
            elAttr['data-validation'] = dataValidationAttr;
        } else if(dataValidationAttr) {
            $.each(dataValidationAttr, function(x, val) {
                if( x === '' ) {
                    elAttr['data-validation'] = val;
                } else {
                    elAttr['data-validation-'+x] = val;
                }
            });
        }

        elAttr['value'] = val;
        $in = $('<'+(elemName || 'input')+' />', elAttr);
        $in.appendTo($form);
        return $in;
    }

    function clearForm() {
        $form.children().remove();
    }

    function runTest(obj, validation) {
        var $el = typeof obj.val == 'string' ? input(obj.val, validation) : obj.val;
        var result = $.formUtils.validateInput($el, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);

        var message;
        if (typeof obj.val === 'string' ) {
            message  = 'Check that "'+obj.val+'" is '+(obj.isValid ? 'valid':'invalid');
        }
        else {
            message = 'Check that '+$el.get(0).nodeName+'[value="'+obj.val.attr('value')+'"] is '+(obj.isValid ? 'valid':'invalid');
        }

        if (!result.shouldChangeDisplay && obj.isValid ) {
            equal(null, null, message);
        }
        else {
            equal(result.isValid, obj.isValid, message);
        }
    }

    function runAllTests() {

        /*
         * Image dimension checks
         */
        var imgDimensionChecks = {
                'square100x100.png' : {
                    'min100x100' : false,
                    'min100x10' : false,
                    'min100' : false,
                    'min200x500' : true,
                    'min200x10': true,
                    'min200' : true,
                    'min100x200' : true,

                    'max100x100' : false,
                    'max100x10' : true,
                    'max100' : false,
                    'max200x500' : false,
                    'max200x10': true,
                    'max200' : false,
                    'max90x200' : true,

                    '100x100-500x500' : false,
                    '100x200-500x500' : true,
                    '200x100-500x500' : true,
                    '50x50-90x500' : true,
                    '30-200x200' : false,
                    '30-100' : false,
                    '30-50' : true
                },
                'rectangle100x50.png' : {
                    'min100x100' : true,
                    'min100x10' : false,
                    'min100' : true,
                    'min200x500' : true,
                    'min200x10': true,
                    'min200' : true,
                    'min10x50' : false
                }
            },
            imageRatioChecks = {
                'square100x100.png' : {
                    '1:1' : false,
                    '1:2-1:1' : false,
                    '8:10-12:10' : false,
                    '1:2' : true,
                    '2:1': true
                },
                'rectangle100x50.png' : {
                    '1:1' : true,
                    '1:2-1:1' : true,
                    '8:10-12:10' : true,
                    '1:2' : true,
                    '2:1': false
                }
            };


        $.each(imgDimensionChecks, function(imgFileName, assertions) {
            var img = document.createElement('IMG');
            img.onload = function() {
                test('Check image dim on '+imgFileName, function() {
                    $.each(assertions, function(valRule, shouldFail) {
                        var didFail = $.formUtils.checkImageDimension(img, valRule, {}) ? true:false;
                        equal(didFail, shouldFail, valRule+' should '+(shouldFail ? 'fail':'NOT fail')+' validation');
                    });
                    $.each(imageRatioChecks[imgFileName], function(ratioDeclaration, shouldFail) {
                       var didFail =  $.formUtils.checkImageRatio(img, ratioDeclaration, {imageRatioNotAccepted:'errorr...'}) ? true:false;
                        equal(didFail, shouldFail, ratioDeclaration+' should '+(shouldFail ? 'fail':'NOT fail')+' validation');
                    });
                });
            };
            img.src = document.location.href.substr(0, document.location.href.lastIndexOf('/')) +'/test-data/'+imgFileName;
        });

        /*
        * Test utility method for getting input values
        */
        test('$.formUtils.getValue', function(assert) {


          var input = '<input value="text">';
          assert.equal($.formUtils.getValue($(input)), 'text');

          var select = '<select><option>A</option><option selected>B</option><option>C</option></select>';
          assert.equal($.formUtils.getValue($(select)), 'B');

          var selectMultipleWithoutSelected = '<select multiple><option>A</option><option>B</option><option>C</option></select>';
          assert.equal($.isEmptyObject($.formUtils.getValue($(selectMultipleWithoutSelected))), true);

          var selectMultiple = '<select multiple><option>A</option><option selected>B</option><option selected>C</option></select>';
          var selected = $.formUtils.getValue($(selectMultiple));
          assert.equal(selected.length, 2);
          assert.equal(selected[0], 'B');
          assert.equal(selected[1], 'C');


        });

      /*
      * Test $.fn.validate
      */
      test('Test $.fn.validate() ', function(assert) {
        clearForm();
        assert.expect(1);
        var $input = input('--', {'':'required alphanumeric'});
        $input.attr('id', 'some-input');
        $('#some-input').validate(function(valid, elem) {
          assert.equal(false, valid);
        });
      });

      /*
       * Test validation of hidden inputs
       */
      test('Validation of hidden inputs', function(assert) {
        clearForm();
        assert.expect(3);
        var $input = input('--', {'':'required alphanumeric'});
        assert.equal(false, $input.closest('form').isValid({}, {}, false));
        $input.hide();
        assert.equal(true, $input.closest('form').isValid({}, {}, false));
        $input.validate(function(valid) {
          assert.equal(false, valid);
        }, {validateHiddenInputs: true});
      });

        /*
         * Test error message
         */
        test('Error messages', function() {

            // default inline (below input) error messages
            var $input = input('', 'required'),
                result = $.formUtils.validateInput($input, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);
            equal(result.errorMsg, 'This is a required field', 'Incorrect message');

            // messages on top of form
            var configWithTopMsg = $.formUtils.defaultConfig();
            configWithTopMsg.errorMessagePosition = "top";
            result = $.formUtils.validateInput($input, $.formUtils.LANG, configWithTopMsg, $form);
            equal(result.errorMsg, 'You have not answered all required fields', 'Incorrect message');

            $input = input('--', {'':'required alphanumeric', 'error-msg-alphanumeric':'custom for alphanum'}),
            result = $.formUtils.validateInput($input, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);
            equal(result.errorMsg, 'custom for alphanum', 'Incorrect message');

            $input = input('sam', {'':'required alphanumeric length', length:'min10', 'error-msg-alphanumeric':'custom for alphanum'}),
            result = $.formUtils.validateInput($input, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);
            equal(result.errorMsg, 'The input value is shorter than 10 characters', 'Incorrect message');

        });

        /*
         * E-MAIL VALIDATION
         */
        test("E-mail validation", function() {

            clearForm();

            var values = [
                {val: 'sasas@sdssds.se', isValid : true},
                {val: 'sasás@sdssds.se', isValid : false},
                {val: 'sas+as@sdssds.se', isValid : true},
                {val: '', isValid : false},
                {val: 'asdsd@sdsds.se', isValid : true},
                {val: 'valid-domain@website.COM', isValid : true},
                {val: 'asdsdsd@sdsd.co.uk', isValid : true},
                {val: 'sasas@sdsd.xxx', isValid : true},
                {val: 'sasas@9gag.com', isValid : true},
                {val: 'sasas@.9gag.com', isValid : false},
                {val: 'sasas@sdsd.xxz', isValid : true},
                {val: '@sdsd.xxz', isValid : false},
                {val: 'sasas@', isValid : false},
                {val: 'sasas.se', isValid : false},
                {val: 'sasas-sdsd.com', isValid : false},
                {val: '"sasas-sdsd"@monkey.com', isValid : true},
                // RFC 5322 gives local-part = dot-atom / quoted-string /
                // obs-local-part, and obs-local-part = word *("." word). A
                // quoted string followed straight by more text, with no dot
                // between them, is not a valid word sequence under any of
                // those, and RFC 5321 is stricter still. This expectation was
                // also inconsistent with the case below: text after a closing
                // quote and text before an opening one are the same kind of
                // malformation, so both belong on the same side.
                {val: '"sasas-sdsd"sdfsdf.sdff@monkey.com', isValid : false},
                {val: 'sdf"sasas-sdsd"@monkey.com', isValid : false}
            ];

            $.each(values, function(i, obj) {
                runTest(obj, 'email');
            });
        });

        /*
         * URL VALIDATION
         */
        test("URL validation", function() {

            clearForm();

            var links = [
                {val: 'klsdmfklsmdf', isValid: false},
                {val: 'http://google.se', isValid: true},
                {val: 'https://google.se/test/?arge=hej_&arg[]=123', isValid: true},
                {val: 'http://google.test.de', isValid: true},
                {val: 'http://test.xn--fiqz9s', isValid: true},
                {val: 'http://test.youtube', isValid: true},
                {val: 'http://google.test.co.uk/', isValid: true}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'url');
            });
        });


        /*
         * DOMAIN VALIDATION
         */
        test("Domain validation", function() {

            clearForm();

            var links = [
                {val:'domain.xxx', isValid:true},
                {val:'domain.com', isValid:true},
                {val:'www.domain.com', isValid:true},
                {val:'test.xn--fiqz9s', isValid:true},
                {val:'test..xn--fiqz9s', isValid:false},
                {val:'q.com', isValid:true},
                {val:'amazone.website.tippit.de', isValid:true},
                {val:'amazone.website.co.uk', isValid:true},
                {val:'http://domain.se', isValid:false},
                {val:'http://www.domain.se', isValid:false},
                {val:'http://www.domain.se/', isValid:false},
                {val:'domain.com/', isValid:false},
                {val:'', isValid:false},
                {val:'asdfasdf', isValid:false}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'domain');
            });
        });

        /*
         * REQUIRED VALIDATION
         */
        test("Require validation", function() {

            clearForm();

            var links = [
                {val:'a', isValid:true},
                {val:'asdf askldfmlksamdf', isValid:true},
                {val:'  ', isValid:false},
                {val:"\n", isValid:false},
                {val:'', isValid:false}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'required');
            });
        });

        /*
         * ALPHANUMERIC VALIDATION
         */
        test("Alphanumeric validation", function() {

            clearForm();

            var links = [
                {val:'a', isValid:true},
                {val:'asdXAvs1', isValid:true},
                {val:'a  b', isValid:false},
                {val:'a-_ bäöåA', isValid:false},
                {val:'abbb', isValid:true},
                {val:'a,bbb', isValid:false},
                {val:input('a,bbb', {'allowing':',', '':'alphanumeric'}), isValid:true},
                {val:input('a b', {'allowing':' ', '':'alphanumeric'}), isValid:true},
                {val:input('', {'allowing':' ', length:'3-12', '':'length alphanumeric'}), isValid:false},
                {val:input('a-_ bäöåÖA', {'allowing':' -_öäåÄÖÅ', '':'alphanumeric'}), isValid:true},
                {val:'bäöåA', isValid:false},
                {val:'ë', isValid:false}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'alphanumeric');
            });
        });

        /*
         * LETTER-NUMERIC VALIDATION
         */
        test("Letter-numeric validation", function() {

            clearForm();

            var links = [
                {val:'a', isValid:true},
                {val:'asdXAvs1', isValid:true},
                {val:'a  b', isValid:false},
                {val:'a-_ bäöåA', isValid:false},
                {val:'abbb', isValid:true},
                {val:'a,bbb', isValid:false},
                {val:input('abbbé', {'allowing':',', '':'letternumeric'}), isValid:true},
                {val:input('a b', {'allowing':' ', '':'alphanumeric'}), isValid:true},
                {val:input('', {'allowing':' ', length:'3-12', '':'length letternumeric'}), isValid:false},
                {val:'bäöåA', isValid:true},
                {val:'bäöåA®', isValid:false},
                {val:'ë', isValid:true}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'letternumeric');
            });
        });

        /*
         * CREDIT CARD VALIDATION
         */
        test("Credit card validation", function() {

            clearForm();

            var links = [
                {val:'4000000000000002', isValid:true},
                {val:input('4000000000000002', {'allowing':'visa', '':'creditcard'}), isValid:true},
                {val:input('4000000000000002', {'allowing':'mastercard, discover, visa', '':'creditcard'}), isValid:true},
                {val:input('501800000009', {'allowing':'maestro', '':'creditcard'}), isValid:true},
                {val:input('501800000009', {'allowing':'visa', '':'creditcard'}), isValid:false},
                {val:input('501800000009', {'allowing':'jadajada,maestro,mastercard', '':'creditcard'}), isValid:true},
                {val:input('5100000000000008', {'allowing':'mastercard', '':'creditcard'}), isValid:true},
                {val:input('6011000000000004', {'allowing':'discover', '':'creditcard'}), isValid:true},
                {val:input('6011000000000005', {'allowing':'discover', '':'creditcard'}), isValid:false}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'creditcard');
            });
        });

        test('isValid()', function() {

            $form.empty();
            $form.append(input('4000000000000002', {'allowing':'visa', '':'creditcard'}));
            $form.append(input('', {'optional':'true', '':'alphanumeric'}));
            $form.append(input('', 'alphanumeric'));
            $form.append(input('4000000000000002', 'alphanumeric'));

            equal(
                $form.isValid(false, false, false),
                false
            );

            $form.empty();
            $form.append(input('4000000000000002', {'allowing':'visa', '':'creditcard'}));
            $form.append(input('', {'optional':'true', '':'alphanumeric'}));
            $form.append(input('fff', 'alphanumeric'));
            $form.append(input('4000000000000002', 'alphanumeric'));

            equal(
                $form.isValid(false, false, false),
                true
            );

        });

        /*
         * CVV VALIDATION
         */
        test("CVV validation", function() {

            clearForm();

            var links = [
                {val:'012', isValid:true},
                {val:'0124', isValid:false},
                {val:'000', isValid:true},
                {val:'01', isValid:false},
                {val:'a12', isValid:false}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'cvv');
            });

            // check with amex only
            var $cCard = input('', {'allowing':'amex', '':'creditcard'}),
                $cvv = input('1234', 'cvv'),
                result;

            // let the validator know which type of card we're validating
            $.formUtils.validateInput($cCard, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);

            result = $.formUtils.validateInput($cvv, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);
            equal(
                true,
                result.isValid
            );

            $cvv.val('123');
            result = $.formUtils.validateInput($cvv, $.formUtils.LANG, $.formUtils.defaultConfig(), $form);
            equal(
                false,
                result.isValid
            );

        });


        /*
         * DISABLED VALIDATION
         */
        test("Do not validate disabled", function() {
            clearForm();
            var $input = input('a--b', {'allowing':'', '':'alphanumeric'});
            $input.attr('disabled', 'disabled');
            runTest({val:$input, isValid: true});
        });

        /*
         * NUMBER VALIDATION type=text (HTML4)
         */
        test('Number validation for <input type=text"/>', function() {

            clearForm();

            var links = [
                {val: '123',    isValid: true},
                {val: '',       isValid: false},
                {val: 'asdfsd', isValid: false},
                {val: '-123',   isValid: false},
                {val: '1.032',  isValid: false},
                {val: '-1.032', isValid: false},
                {val: input('-123'  , {'allowing': 'negative', '': 'number'}),                isValid: true},
                {val: input('-1',     {'allowing': 'range[-10;10],negative', '': 'number'}), isValid: true},
              //Test ranges
                {val: input('12',     {'allowing': 'range[1;10]', '':'number'}), isValid: false},
                {val: input('-1',     {'allowing': 'range[1;10]', '':'number'}), isValid: false},
                {val: input('1',      {'allowing': 'range[1;10]', '':'number'}), isValid: true},
                {val: input('10',     {'allowing': 'range[1;10]', '':'number'}), isValid: true},
                {val: input('5',      {'allowing': 'range[1;10]', '':'number'}), isValid: true},
                {val: input('',       {'optional': true, '': 'number' }),        isValid: true},
              //Test floats
                {val: input('1.023' , {'allowing': 'float', '': 'number'}),      isValid: true},
                {val: input('-1.023', {'allowing': 'float,negative', '': 'number'}),        isValid: true},
                {val: input('1.0234', {'allowing': 'float,negative', '': 'number'}),        isValid: true},
                {val: input('1.0235', {'allowing': 'float,negative,number', '': 'number'}), isValid: true},
                {val: input('1.0236', {'allowing': 'float,negative,number', 'decimal-separator': ',',
                            '': 'number'}),                                                  isValid: false},
                {val: input('1,023',  {'allowing': 'float,negative,number', 'decimal-separator':',',
                            '': 'number'}),                                                  isValid: true},
                {val: input('0.0001', {'allowing': 'range[0.05;0.9]', '': 'number'}),        isValid: false},
                {val: input('0.06',   {'allowing': 'range[0.05;0.9],float', '': 'number'}),  isValid: true}
            ];

            $.each(links, function(i, obj) {
                runTest(obj, 'number');
            });
        });

        /**
         *  NUMBER VALIDATION for type = "number" (HTML5)
         */
        test('Number validation for <input type="number"/>', function () {
          clearForm();
          var links = [];
          var numberType = {type: 'number'};
          links.push(
            {val: input('123',    {'': 'number'}, numberType), isValid: true},
            {val: input('',       {'': 'number'}, numberType), isValid: false},
            {val: input('asdfsd', {'': 'number'}, numberType), isValid: false},
            {val: input('-123',   {'': 'number'}, numberType), isValid: false},
            {val: input('1.032',  {'': 'number'}, numberType), isValid: false},
            {val: input('-1.032', {'': 'number'}, numberType), isValid: false},
            {val: input('-123'  , {'allowing': 'negative', '': 'number'}, numberType),   isValid: true},
            {val: input('',       {'optional': true, '': 'number' }, numberType),  isValid: true},
            //Test ranges
            {val: input('12',     {'allowing': 'range[1;10]', '':'number'}, numberType), isValid: false},
            {val: input('-1',     {'allowing': 'range[1;10]', '':'number'}, numberType), isValid: false},
            {val: input('1',      {'allowing': 'range[1;10]', '':'number'}, numberType), isValid: true},
            {val: input('10',     {'allowing': 'range[1;10]', '':'number'}, numberType), isValid: true},
            {val: input('5',      {'allowing': 'range[1;10]', '':'number'}, numberType), isValid: true},
            {val: input('-1',     {'allowing': 'range[-10;10],negative', '': 'number'}, numberType), isValid: true},
            //Test floats
            {val: input('1.023' , {'allowing': 'float', '': 'number'}, numberType),      isValid: true},
            {val: input('-1.023', {'allowing': 'float,negative', '': 'number'}, numberType),        isValid: true},
            {val: input('1.0234', {'allowing': 'float,negative', '': 'number'}, numberType),        isValid: true},
            {val: input('1.0235', {'allowing': 'float,negative,number', '': 'number'}, numberType), isValid: true},
            {val: input('1.0236', {'allowing': 'float,negative,number', 'decimal-separator': ',',
                        '': 'number'}, numberType),                                                 isValid: false},
            {val: input('0.0001', {'allowing': 'range[0.05;0.9]', '': 'number'}, numberType),       isValid: false},
            {val: input('0.06',   {'allowing': 'range[0.05;0.9],float', 'decimal-separator': '.',
                                   '': 'number'}, numberType), isValid: true}
          );
          /* Tests that fail with HTML input type number because of bugs in how browsers handle decimal separators:
           {val: input('1,023',  {'allowing': 'float,negative,number', 'decimal-separator':',',
                 '': 'number'}, {'lang': 'no', type: 'number'}),                                    isValid: true},
           */

          $.each(links, function(i, obj) {
            runTest(obj, 'number');
          });
        });
        /*
         * DATE VALIDATION
         */
        test("Date validation", function() {

            clearForm();

            var dates = [
                {val:'2000-01-01', isValid:true},
                {val:'2000-01-1', isValid:false},
                {val:'2000-01-32', isValid:false},
                {val:'2000-02-29', isValid:true}, // leap year
                {val:'2013-02-29', isValid:false},
                {val:'2000-04-31', isValid:false},
                {val:'2000-13-1', isValid:false},
                {val:input('2000-1-1', {'':'date'}), isValid:false},
                {val:input('2000-1-1', {'':'date', 'require-leading-zero':'false'}), isValid:true},
                {val:'-01-01', isValid:false},
                {val:input('01/01/2000', {'format':'dd/mm/yyyy', '':'date'}), isValid:true},
                {val:input('29/02/2000', {'format':'dd/mm/yyyy', '':'date'}), isValid:true},
                {val:input('02/2000', {'format':'mm/yyyy', '':'date'}), isValid:true},
                {val:input('29/02/2013', {'format':'dd/mm/yyyy', '':'date'}), isValid:false},
                {val:input('29/13/2013', {'format':'dd/mm/yyyy', '':'date'}), isValid:false},
                {val:input('29/00/2013', {'format':'dd/mm/yyyy', '':'date'}), isValid:false},
                {val:'', isValid:false},
                {val:input('', {'optional':'true', 'format':'dd/mm/yyyy', '':'date'}), isValid:true},
                {val:'2014-01-01', isValid:true},
                {val:'1880-01-01', isValid:true}
            ];

            $.each(dates, function(i, obj) {
                runTest(obj, 'date');
            });
        });

        /*
         * BIRTH DATE VALIDATION
         */
        test("Birth date validation", function() {

            clearForm();

            var dates = [
                {val:'2000-01-01', isValid:true},
                {val:'2000-01-1', isValid:false},
                {val:'2000-01-32', isValid:false},
                {val:'2000-02-29', isValid:true}, // leap year
                {val:'2013-02-29', isValid:false},
                {val:'2000-04-31', isValid:false},
                {val:'2000-13-1', isValid:false},
                {val:'2000-1-1', isValid:false},
                {val:'-01-01', isValid:false},
                {val:input('01/01/2000', {'format':'dd/mm/yyyy', '':'birthdate'}), isValid:true},

                        'data-sanitize-insert-left' : '$ '
                    }
                },

                    }

        return $el.appendTo($wrap);

      test('Strength: length outranks composition', function(assert) {
        // The whole point of the rewrite. Under the pre-3.0 scoring "P@ss1!"
        // rated 3 (strong) because of its symbol, digit and mixed case, while
        // a long lowercase password rated lower. NIST SP 800-63B rev 4 retired
        // exactly that trade.
        assert.equal(strengthOf('P@ss1!'), 0, 'a short password with every character class is not strong');
        assert.equal(strengthOf('correcthorsebatterystaple'), 3, 'a long lowercase passphrase is strong');
        assert.equal(strengthOf('thequickbrownfox'), 3, 'sixteen lowercase characters are strong');
        assert.ok(strengthOf('correcthorsebatterystaple') > strengthOf('P@ss1!'),
          'the long passphrase outranks the short complex one');
      });

      test('Strength: runs and sequences are discounted', function(assert) {

        assert.equal(strengthOf('abcdefghijklmnop'), 0, 'a sixteen character sequence is not strong');
        assert.ok(strengthOf('abcdefghijklmnop') < strengthOf('thequickbrownfox'),
          'the same length scores lower when it is sequential');
      });

        assert.equal(strengthOf('letmein123'), 0, 'trailing digits do not rescue it');
        assert.equal(strengthOf('qwertyuiop'), 0, 'a keyboard row scores zero');

          .then(function (buffer) {
            var view = new window.Uint8Array(buffer), out = [], i;
            for (i = 0; i < view.length; i++) {
              out.push(('0' + view[i].toString(16)).slice(-2));
            }
            var hex = out.join('').toUpperCase(),
                suffix = hex.substring(5);

            window.fetch = function () {
              return Promise.resolve({
                ok: true,
                text: function () {
                  return Promise.resolve('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:3\n' + suffix + ':42');
                }
              });
            };

            var $el = a11yInput($f, password, 'breached', {
              name: 'breach-hit',
              'data-validation-debounce': '0',
              'data-validation-breach-url': 'https://example.test/range/'
            });
            $f.trigger('formValidationSetup', [$f, conf]);
            $el.validateInputOnBlur($.formUtils.LANG, conf, false, 'blur');

            setTimeout(function () {
              window.fetch = realFetch;
              assert.equal($el.attr('aria-invalid'), 'true', 'a breached password is rejected');
              $f.remove();
              done();
            }, 250);
          });
      });

      test('Breached: a lookup failure does not lock the user out', function(assert) {
        var done = assert.async(),
            realFetch = window.fetch,
            $f = a11yFixture(),
            conf = $.extend($.formUtils.defaultConfig(), {errorMessagePosition: 'inline'}),
            $el;

        window.fetch = function () {
          return Promise.reject(new Error('network down'));
        };

        $el = a11yInput($f, 'correcthorsebatterystaple', 'breached', {
          name: 'breach-fail',
          'data-validation-debounce': '0',
          'data-validation-breach-url': 'https://example.test/range/'
        });
        $f.trigger('formValidationSetup', [$f, conf]);
        $el.validateInputOnBlur($.formUtils.LANG, conf, false, 'blur');

        setTimeout(function () {
          window.fetch = realFetch;
          // Failing closed would make an outage of a third party service into
          // an outage of the form.
          assert.equal($el.attr('aria-invalid'), undefined, 'the value is allowed when the service cannot be reached');
          assert.equal($.formUtils.haltValidation, false, 'and the form is not left halted');
          $f.remove();
          done();
        }, 250);
      });


      /*
       * Phase 6: message templates and Intl
       */

      test('i18n: placeholders are substituted', function(assert) {
        var f = $.formUtils.formatMessage;
        assert.equal(f('between {0} characters', [10]), 'between 10 characters', 'a single placeholder');
        assert.equal(f('{0} of {1}', [3, 7]), '3 of 7', 'several placeholders');
        assert.equal(f('{0} and {0}', ['x']), 'x and x', 'a repeated placeholder');
        assert.equal(f('nothing to fill'), 'nothing to fill', 'a template with no placeholder');
        assert.equal(f('unknown {9}', ['a']), 'unknown {9}', 'an index with no argument is left alone');
      });

      test('i18n: plural forms are chosen by count', function(assert) {
        var forms = {one: '{0} item', other: '{0} items'};
        assert.equal($.formUtils.formatMessage(forms, [1], 1), '1 item', 'the singular form for one');
        assert.equal($.formUtils.formatMessage(forms, [3], 3), '3 items', 'the plural form for three');
        assert.equal($.formUtils.formatMessage(forms, [0], 0), '0 items', 'the plural form for zero in English');
        assert.equal($.formUtils.formatMessage(forms, [2]), '2 items',
          'the other form when no count is given');
      });

      test('i18n: a template is preferred, fragments still work', function(assert) {
        var withTemplate = {
              lengthTooShort: 'shorter than {0} chars',
              lengthTooShortStart: 'IGNORED',
              lengthBadEnd: 'IGNORED'
            },
            legacyOnly = {
              lengthTooShortStart: 'The input value is shorter than ',
              lengthBadEnd: ' characters'
            };

        assert.equal(
          $.formUtils.resolveCountMessage(withTemplate, 'lengthTooShort', 'lengthTooShortStart',
            withTemplate.lengthBadEnd, 4, 4),
          'shorter than 4 chars',
          'the template wins when present');

        // A language file or config that only knows the pre-3.0 fragment keys
        // has to keep rendering exactly what it did before.
        assert.equal(
          $.formUtils.resolveCountMessage(legacyOnly, 'lengthTooShort', 'lengthTooShortStart',
            legacyOnly.lengthBadEnd, 4, 4),
          'The input value is shorter than 4 characters',
          'the fragments are used when no template exists');
      });

      test('i18n: the length validator renders through the template', function(assert) {
        var $f = a11yFixture(),
            conf = $.formUtils.defaultConfig(),
            $el = a11yInput($f, 'ab', 'length', {name: 'len-target', 'data-validation-length': 'min4'}),
            result = $.formUtils.validateInput($el, $.formUtils.LANG, conf, $f);

        assert.equal(result.isValid, false, 'a value under the minimum is rejected');
        assert.equal(result.errorMsg, 'The input value is shorter than 4 characters',
          'and the message reads as a whole sentence');

        $f.remove();
      });

      test('i18n: every bundled language composes the same sentence', function(assert) {
        // The templates were derived from each language's own fragments, so a
        // template must render byte-identically to the concatenation it
        // replaced. This guards against a botched migration.
        var lang = $.formUtils.LANG;
        if (lang.lengthTooShort === undefined || lang.lengthBadEnd === undefined) {
          assert.ok(true, 'this language has no length template loaded');
          return;
        }
        var viaTemplate = $.formUtils.formatMessage(lang.lengthTooShort, [4], 4),
            viaFragments = lang.lengthTooShortStart + 4 + lang.lengthBadEnd;

        if (typeof lang.lengthTooShort === 'object') {
          // English carries real plural forms, so only the plural branch can
          // match the old fragment wording.
          viaTemplate = $.formUtils.formatMessage(lang.lengthTooShort, [4], 4);
        }
        assert.equal(viaTemplate, viaFragments,
          'the template renders what the fragments did');
      });

      test('Intl: the locale decimal separator is available but not assumed', function(assert) {
        var sep = $.formUtils.localeDecimalSeparator();
        assert.ok(sep === '.' || sep === ',' || sep.length === 1, 'a single separator character is returned');

        // Following the browser locale by default would silently change what a
        // form accepts, so the default stays '.'.
        assert.equal($.formUtils.defaultConfig().decimalSeparator, '.',
          'the default is still a full stop, not the browser locale');
      });

      test('Intl: numberFormat sanitation no longer requires numeral', function(assert) {
        var realNumeral = window.numeral;
        try {
          window.numeral = undefined;
          // Used to throw ReferenceError outright.
          assert.equal($.formUtils.unformatNumber('1 234 567,89'), '1234567,89',
            'grouping is stripped without numeral present');
        } finally {
          window.numeral = realNumeral;
        }
      });


      /*
       * Regressions from commit c017200 ("Fix critical and high-severity bugs
       * across validation modules"), which over-corrected in five places.
       */

      test('Regression: internationalised TLDs are accepted', function(assert) {
        var domain = $.formUtils.validators.validate_domain.validatorFunction;

        // A-labels legitimately contain hyphens. Rejecting every non
        // alphanumeric character in the TLD turned away every IDN.
        assert.equal(domain('test.xn--fiqz9s'), true, 'xn--fiqz9s (.中国)');
        assert.equal(domain('example.xn--p1ai'), true, 'xn--p1ai (.рф)');
        assert.equal(domain('example.com'), true, 'an ordinary TLD still passes');

        // ...without letting anything with a hyphen through.
        assert.equal(domain('example.-com'), false, 'a TLD may not start with a hyphen');
        assert.equal(domain('example.com-'), false, 'nor end with one');
        assert.equal(domain('example.c'), false, 'a single letter TLD is still rejected');
        assert.equal(domain('example.12'), false, 'an all numeric TLD is still rejected');
      });

      test('Regression: the card type reaches the cvv validator', function(assert) {
        var $f = a11yFixture(),
            conf = $.formUtils.defaultConfig(),
            $card = a11yInput($f, '378282246310005', 'creditcard', {name: 'amex-card', 'data-validation-allowing': 'amex'}),
            $cvv = a11yInput($f, '1234', 'cvv', {name: 'amex-cvv'});

        // The credit card validator works out the card type; the cvv validator
        // needs it to know whether to expect three digits or four. Keeping that
        // on the card element meant the cvv validator never saw it.
        $.formUtils.validateInput($card, $.formUtils.LANG, conf, $f);

        assert.equal($.formUtils.validateInput($cvv, $.formUtils.LANG, conf, $f).isValid, true,
          'four digits are accepted for an amex-only form');

        $cvv.val('123');
        assert.equal($.formUtils.validateInput($cvv, $.formUtils.LANG, conf, $f).isValid, false,
          'three digits are rejected for an amex-only form');

        $f.remove();
      });

      test('Regression: the card type does not leak between forms', function(assert) {
        // This is what moving the state off module scope was meant to fix, and
        // it has to keep working now that the state lives on the form.
        var conf = $.formUtils.defaultConfig(),
            $amexForm = a11yFixture(),
            $visaForm = a11yFixture(),
            $amexCard = a11yInput($amexForm, '378282246310005', 'creditcard',
              {name: 'a-card', 'data-validation-allowing': 'amex'}),
            $visaCard = a11yInput($visaForm, '4111111111111111', 'creditcard',
              {name: 'v-card', 'data-validation-allowing': 'visa'}),
            $amexCvv = a11yInput($amexForm, '1234', 'cvv', {name: 'a-cvv'}),
            $visaCvv = a11yInput($visaForm, '1234', 'cvv', {name: 'v-cvv'});

        $.formUtils.validateInput($amexCard, $.formUtils.LANG, conf, $amexForm);
        $.formUtils.validateInput($visaCard, $.formUtils.LANG, conf, $visaForm);

        assert.equal($.formUtils.validateInput($amexCvv, $.formUtils.LANG, conf, $amexForm).isValid, true,
          'four digits pass on the amex form');
        assert.equal($.formUtils.validateInput($visaCvv, $.formUtils.LANG, conf, $visaForm).isValid, false,
          'four digits fail on the visa form, so the amex form did not bleed into it');

        $amexForm.remove();
        $visaForm.remove();
      });

      test('Regression: a dot is only a thousands separator on a group boundary', function(assert) {
        var $f = a11yFixture(),
            conf = $.formUtils.defaultConfig();

        function check(value) {
          var $el = a11yInput($f, value, 'number', {
            name: 'grp-' + value.replace(/\W/g, '_'),
            'data-validation-allowing': 'float,negative,number',
            'data-validation-decimal-separator': ','
          });
          return $.formUtils.validateInput($el, $.formUtils.LANG, conf, $f).isValid;
        }

        // Stripping every dot unconditionally turned "1.0236" -- a dot used as
        // a decimal point, which this input does not accept -- into 10236.
        assert.equal(check('1.0236'), false, '1.0236 is not a grouped number');
        assert.equal(check('1.02'), false, 'nor is 1.02');
        assert.equal(check('1,023'), true, 'a comma is the decimal separator here');
        assert.equal(check('1.234'), true, '1.234 is a properly grouped thousand');
        assert.equal(check('1.234.567'), true, 'and so is 1.234.567');
        assert.equal(check('1.234.567,89'), true, 'grouping plus a decimal part');

        $f.remove();
      });

      test('Regression: a date format need not carry every unit', function(assert) {
        var parse = function (val, format) {
          return $.formUtils.parseDate(val, format);
        };

        // findDateUnit returns -1 for an absent unit, and the guard treated
        // that as an invalid zero, so any format without a day was rejected.
        assert.notEqual(parse('02/2000', 'mm/yyyy'), false, 'mm/yyyy is a usable format');
        assert.deepEqual(parse('02/2000', 'mm/yyyy'), [2000, 2, 1],
          'the absent day comes back as 1 so date arithmetic still works');

        assert.notEqual(parse('2000-02-29', 'yyyy-mm-dd'), false, 'a full date still parses');
        assert.equal(parse('13/2000', 'mm/yyyy'), false, 'an impossible month is still rejected');
        assert.equal(parse('00/2000', 'mm/yyyy'), false, 'and so is a zero month');
        assert.equal(parse('2013-02-29', 'yyyy-mm-dd'), false, '29 February in a common year is still rejected');
        assert.equal(parse('2000-04-31', 'yyyy-mm-dd'), false, '31 April is still rejected');
      });
